<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nostr Git Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f6f8fa;
      color: #1f2328;
      height: 100vh;
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #24292f;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    .status { display: flex; gap: 12px; font-size: 13px; }
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .status-dot.connected { background: #3fb950; }
    .status-dot.disconnected { background: #f85149; }
    .status-dot.connecting { background: #d29922; }
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      width: 240px;
      background: #fff;
      border-right: 1px solid #d0d7de;
      display: flex;
      flex-direction: column;
    }
    .sidebar h2 {
      font-size: 12px;
      text-transform: uppercase;
      color: #656d76;
      padding: 12px 16px;
      border-bottom: 1px solid #d0d7de;
    }
    .repo-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .repo-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      gap: 8px;
    }
    .repo-item:hover { background: #f6f8fa; }
    .repo-item.selected { background: #ddf4ff; }
    .repo-item .name { flex: 1; font-size: 14px; }
    .repo-item .sync-btn {
      opacity: 0;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
    .repo-item:hover .sync-btn { opacity: 1; }
    .repo-item.syncing .sync-btn { opacity: 1; animation: spin 1s linear infinite; }
    .repo-item .sync-btn.pushing { opacity: 1; color: #2da44e; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .add-btn {
      margin: 8px;
      padding: 8px;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .add-btn:hover { background: #eaeef2; }
    .file-tree {
      width: 280px;
      background: #fff;
      border-right: 1px solid #d0d7de;
      overflow-y: auto;
      padding: 8px;
    }
    .file-entry {
      display: flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      gap: 6px;
    }
    .file-entry:hover { background: #f6f8fa; }
    .file-entry.selected { background: #ddf4ff; }
    .file-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .file-toolbar {
      padding: 8px 16px;
      background: #f6f8fa;
      border-bottom: 1px solid #d0d7de;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .file-toolbar .path { font-family: monospace; color: #656d76; }
    .file-content {
      flex: 1;
      overflow: auto;
      padding: 16px;
      background: #fff;
    }
    .file-content pre {
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .file-content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #656d76;
      font-size: 14px;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      width: 400px;
      max-width: 90%;
    }
    .modal h2 { margin-bottom: 16px; font-size: 18px; }
    .modal label {
      display: block;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .modal label span { display: block; margin-bottom: 4px; color: #656d76; }
    .modal input, .modal textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 14px;
    }
    .modal textarea { resize: vertical; }
    .modal .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
    .modal button {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .modal button[type="button"] {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
    }
    .modal button[type="submit"] {
      background: #2da44e;
      border: none;
      color: #fff;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #24292f;
      color: #fff;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 200;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .settings-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
      opacity: 0.8;
    }
    .settings-btn:hover { opacity: 1; }
    .test-btn {
      background: #238636;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .test-btn:hover { background: #2ea043; }
    .test-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pubkey-display {
      font-family: monospace;
      font-size: 11px;
      background: #f6f8fa;
      padding: 8px;
      border-radius: 4px;
      word-break: break-all;
      margin-top: 4px;
    }
    .test-result {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .test-result.success { background: #dafbe1; color: #1a7f37; }
    .test-result.error { background: #ffebe9; color: #cf222e; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    // === Dependencies ===
    import { h, render } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect, useCallback, useMemo } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';
    import git from 'https://esm.sh/isomorphic-git@1.25.3';
    import http from 'https://esm.sh/isomorphic-git@1.25.3/http/web';
    import LightningFS from 'https://esm.sh/@isomorphic-git/lightning-fs@4.6.0';
    import { schnorr } from 'https://esm.sh/@noble/curves@1.3.0/secp256k1';
    import { bytesToHex, hexToBytes } from 'https://esm.sh/@noble/hashes@1.3.3/utils';
    import { sha256 } from 'https://esm.sh/@noble/hashes@1.3.3/sha256';

    const html = htm.bind(h);

    // === NIP-98 Auth ===
    function getPrivkey() {
      return localStorage.getItem('nostr-git-privkey') || '';
    }

    function setPrivkey(key) {
      localStorage.setItem('nostr-git-privkey', key);
    }

    function getPubkeyFromPrivkey(privkey) {
      try {
        const pubkeyBytes = schnorr.getPublicKey(privkey);
        return bytesToHex(pubkeyBytes);
      } catch {
        return '';
      }
    }

    function serializeEvent(event) {
      return JSON.stringify([
        0,
        event.pubkey,
        event.created_at,
        event.kind,
        event.tags,
        event.content
      ]);
    }

    function getEventHash(event) {
      const serialized = serializeEvent(event);
      const encoder = new TextEncoder();
      return bytesToHex(sha256(encoder.encode(serialized)));
    }

    async function signEvent(event, privkey) {
      const pubkey = getPubkeyFromPrivkey(privkey);
      const eventWithPubkey = { ...event, pubkey };
      const id = getEventHash(eventWithPubkey);
      const sig = bytesToHex(schnorr.sign(id, privkey));
      return { ...eventWithPubkey, id, sig };
    }

    async function createNip98Token(url, method, privkey) {
      const event = {
        kind: 27235,
        created_at: Math.floor(Date.now() / 1000),
        tags: [
          ['u', url],
          ['method', method]
        ],
        content: ''
      };
      const signed = await signEvent(event, privkey);
      return 'Nostr ' + btoa(JSON.stringify(signed));
    }

    async function nip98Fetch(url, method, privkey, body = null) {
      const auth = await createNip98Token(url, method, privkey);
      const options = {
        method,
        headers: {
          'Authorization': auth
        }
      };
      if (body !== null) {
        options.body = body;
        options.headers['Content-Type'] = 'text/plain';
      }
      return fetch(url, options);
    }

    // === Storage ===
    const fs = new LightningFS('nostr-git-browser');
    const pfs = fs.promises;
    const SYNC_DIR = '/sync';

    // === Config ===
    const DEFAULT_CONFIG = {
      relays: ['wss://nos.lol', 'wss://relay.damus.io', 'wss://melvin.me/relay'],
      repos: {}
    };

    function loadConfig() {
      try {
        return JSON.parse(localStorage.getItem('nostr-git-config')) || DEFAULT_CONFIG;
      } catch {
        return DEFAULT_CONFIG;
      }
    }

    function saveConfig(config) {
      localStorage.setItem('nostr-git-config', JSON.stringify(config));
    }

    // === Git Operations ===
    async function ensureDir(path) {
      try {
        await pfs.mkdir(path, { recursive: true });
      } catch (e) {
        if (e.code !== 'EEXIST') throw e;
      }
    }

    async function cloneRepo(repoId, cloneUrl, branch) {
      const dir = `${SYNC_DIR}/${repoId}`;
      await ensureDir(SYNC_DIR);

      console.log(`Cloning ${cloneUrl} to ${dir}...`);
      await git.clone({
        fs,
        http,
        dir,
        url: cloneUrl,
        ref: branch,
        singleBranch: true,
        depth: 1
      });
      console.log('Clone complete');
    }

    async function pullRepo(repoId, branch = 'main') {
      const dir = `${SYNC_DIR}/${repoId}`;
      console.log(`Pulling ${repoId}...`);
      await git.pull({
        fs,
        http,
        dir,
        ref: branch,
        singleBranch: true,
        author: { name: 'browser', email: 'browser@local' }
      });
      console.log('Pull complete');
    }

    async function pushRepo(repoId, cloneUrl, branch = 'main') {
      const dir = `${SYNC_DIR}/${repoId}`;
      const privkey = getPrivkey();

      if (!privkey) {
        throw new Error('No private key configured. Open Settings to add one.');
      }

      console.log(`Pushing ${repoId} to ${cloneUrl}...`);
      await git.push({
        fs,
        http,
        dir,
        url: cloneUrl,
        ref: branch,
        onAuth: async (url) => {
          // Create NIP-98 token for this URL
          const event = {
            kind: 27235,
            created_at: Math.floor(Date.now() / 1000),
            tags: [
              ['u', url],
              ['method', 'POST']  // Git uses POST for push
            ],
            content: ''
          };
          const signed = await signEvent(event, privkey);
          const token = btoa(JSON.stringify(signed));
          return { username: 'nostr', password: token };
        }
      });
      console.log('Push complete');
    }

    async function commitChanges(repoId, message) {
      const dir = `${SYNC_DIR}/${repoId}`;
      const privkey = getPrivkey();
      const pubkey = getPubkeyFromPrivkey(privkey);

      // Stage all changes
      await git.add({ fs, dir, filepath: '.' });

      // Create commit
      const sha = await git.commit({
        fs,
        dir,
        message,
        author: {
          name: pubkey ? `nostr:${pubkey.slice(0, 8)}` : 'browser',
          email: pubkey ? `${pubkey.slice(0, 8)}@nostr` : 'browser@local'
        }
      });
      console.log('Commit:', sha);
      return sha;
    }

    async function writeFile(repoId, filePath, content) {
      const fullPath = `${SYNC_DIR}/${repoId}/${filePath}`;
      await pfs.writeFile(fullPath, content, 'utf8');
    }

    async function repoExists(repoId) {
      try {
        await pfs.stat(`${SYNC_DIR}/${repoId}/.git`);
        return true;
      } catch {
        return false;
      }
    }

    async function listFiles(repoId, dirPath = '') {
      const dir = `${SYNC_DIR}/${repoId}/${dirPath}`;
      const entries = await pfs.readdir(dir);
      const result = [];

      for (const name of entries) {
        if (name === '.git') continue;
        const fullPath = dirPath ? `${dirPath}/${name}` : name;
        const stat = await pfs.stat(`${SYNC_DIR}/${repoId}/${fullPath}`);
        result.push({
          name,
          path: fullPath,
          type: stat.isDirectory() ? 'dir' : 'file'
        });
      }

      return result.sort((a, b) => {
        if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
    }

    async function readFile(repoId, filePath) {
      const content = await pfs.readFile(`${SYNC_DIR}/${repoId}/${filePath}`, 'utf8');
      return content;
    }

    async function deleteRepo(repoId) {
      const dir = `${SYNC_DIR}/${repoId}`;
      async function rmrf(path) {
        const stat = await pfs.stat(path);
        if (stat.isDirectory()) {
          const entries = await pfs.readdir(path);
          for (const entry of entries) {
            await rmrf(`${path}/${entry}`);
          }
          await pfs.rmdir(path);
        } else {
          await pfs.unlink(path);
        }
      }
      await rmrf(dir);
    }

    // === Nostr ===
    function connectRelays(relays, repoIds, trusted, onEvent) {
      const sockets = [];

      for (const url of relays) {
        const ws = new WebSocket(url);
        sockets.push({ url, ws, status: 'connecting' });

        ws.onopen = () => {
          console.log(`Connected to ${url}`);
          sockets.find(s => s.url === url).status = 'connected';

          // Subscribe to 30617 events for our repos
          ws.send(JSON.stringify([
            'REQ', 'sync',
            { kinds: [30617], '#d': repoIds }
          ]));
        };

        ws.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data);
            if (msg[0] === 'EVENT' && msg[2]) {
              const event = msg[2];
              if (trusted.includes(event.pubkey)) {
                onEvent(event);
              }
            }
          } catch (err) {
            console.error('Parse error:', err);
          }
        };

        ws.onclose = () => {
          console.log(`Disconnected from ${url}`);
          sockets.find(s => s.url === url).status = 'disconnected';
        };

        ws.onerror = (err) => {
          console.error(`Error from ${url}:`, err);
        };
      }

      return sockets;
    }

    // === Components ===
    function Header({ relayStatus, onSettings }) {
      return html`
        <header>
          <h1>🔗 Nostr Git Browser</h1>
          <div class="header-actions">
            <div class="status">
              ${relayStatus.map(r => html`
                <span key=${r.url}>
                  <span class="status-dot ${r.status}"></span>
                  ${new URL(r.url).host}
                </span>
              `)}
            </div>
            <button class="settings-btn" onClick=${onSettings} title="Settings">⚙️</button>
          </div>
        </header>
      `;
    }

    function RepoList({ repos, selected, syncing, pushing, onSelect, onSync, onPush, onDelete, onAdd }) {
      return html`
        <div class="sidebar">
          <h2>Repositories</h2>
          <div class="repo-list">
            ${Object.entries(repos).map(([id, repo]) => html`
              <div
                key=${id}
                class="repo-item ${selected === id ? 'selected' : ''} ${syncing === id ? 'syncing' : ''}"
                onClick=${() => onSelect(id)}
              >
                <span>📁</span>
                <span class="name">${id}</span>
                <button
                  class="sync-btn"
                  onClick=${(e) => { e.stopPropagation(); onSync(id); }}
                  title="Pull"
                >↻</button>
                <button
                  class="sync-btn ${pushing === id ? 'pushing' : ''}"
                  onClick=${(e) => { e.stopPropagation(); onPush(id); }}
                  title="Push"
                  style="margin-left: 2px;"
                >↑</button>
              </div>
            `)}
            ${Object.keys(repos).length === 0 && html`
              <div class="empty-state">No repos yet</div>
            `}
          </div>
          <button class="add-btn" onClick=${onAdd}>+ Add Repository</button>
        </div>
      `;
    }

    function FileTree({ files, selected, expanded, onSelect, onToggle, depth = 0 }) {
      return html`
        ${files.map(entry => html`
          <div key=${entry.path}>
            <div
              class="file-entry ${selected === entry.path ? 'selected' : ''}"
              style="padding-left: ${12 + depth * 16}px"
              onClick=${() => entry.type === 'dir' ? onToggle(entry.path) : onSelect(entry.path)}
            >
              <span>${entry.type === 'dir' ? (expanded.has(entry.path) ? '📂' : '📁') : '📄'}</span>
              <span>${entry.name}</span>
            </div>
            ${entry.type === 'dir' && expanded.has(entry.path) && entry.children && html`
              <${FileTree}
                files=${entry.children}
                selected=${selected}
                expanded=${expanded}
                onSelect=${onSelect}
                onToggle=${onToggle}
                depth=${depth + 1}
              />
            `}
          </div>
        `)}
      `;
    }

    function FileView({ path, content, localFiles = {} }) {
      const [mode, setMode] = useState('raw');
      const isHtml = path?.endsWith('.html');

      // Inject fetch wrapper for local files when rendering HTML preview
      const previewContent = useMemo(() => {
        if (!isHtml || !content) return content;

        const fetchWrapper = '<script>' +
          'window.__localFiles = ' + JSON.stringify(localFiles) + ';' +
          'const _fetch = window.fetch;' +
          'window.fetch = (url, ...args) => {' +
          '  const name = String(url).split("?")[0];' +
          '  if (window.__localFiles[name] !== undefined) {' +
          '    return Promise.resolve(new Response(JSON.stringify(window.__localFiles[name]), {' +
          '      headers: { "Content-Type": "application/json" }' +
          '    }));' +
          '  }' +
          '  return _fetch(url, ...args);' +
          '};' +
          '<' + '/script>';

        // Insert after <head> or at start of document
        if (content.includes('<head>')) {
          return content.replace('<head>', '<head>' + fetchWrapper);
        }
        return fetchWrapper + content;
      }, [content, localFiles, isHtml]);

      return html`
        <div class="file-view">
          ${path ? html`
            <div class="file-toolbar">
              <span class="path">${path}</span>
              ${isHtml && html`
                <button onClick=${() => setMode(m => m === 'raw' ? 'preview' : 'raw')}>
                  ${mode === 'raw' ? 'Preview' : 'Raw'}
                </button>
              `}
            </div>
            <div class="file-content">
              ${mode === 'preview' && isHtml
                ? html`<iframe srcdoc=${previewContent} sandbox="allow-scripts" />`
                : html`<pre>${content}</pre>`
              }
            </div>
          ` : html`
            <div class="empty-state">Select a file to view</div>
          `}
        </div>
      `;
    }

    function AddRepoModal({ onAdd, onClose }) {
      const [id, setId] = useState('');
      const [cloneUrl, setCloneUrl] = useState('');
      const [branch, setBranch] = useState('gh-pages');
      const [trusted, setTrusted] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        onAdd({
          id,
          cloneUrl,
          branch,
          trusted: trusted.split(/[,\n]+/).map(s => s.trim()).filter(Boolean)
        });
      };

      return html`
        <div class="modal-overlay" onClick=${onClose}>
          <form class="modal" onClick=${e => e.stopPropagation()} onSubmit=${handleSubmit}>
            <h2>Add Repository</h2>
            <label>
              <span>Repository ID</span>
              <input value=${id} onInput=${e => setId(e.target.value)} placeholder="20260202" required />
            </label>
            <label>
              <span>Clone URL</span>
              <input value=${cloneUrl} onInput=${e => setCloneUrl(e.target.value)}
                placeholder="https://melvin.me/public/git/sync/20260202" required />
            </label>
            <label>
              <span>Branch</span>
              <input value=${branch} onInput=${e => setBranch(e.target.value)} />
            </label>
            <label>
              <span>Trusted Pubkeys (one per line)</span>
              <textarea value=${trusted} onInput=${e => setTrusted(e.target.value)}
                placeholder="d769d2b81c051d2f2c0b437d0ffe39e00ff0f7161b520f0bd30811f4c057795f" rows="3" />
            </label>
            <div class="buttons">
              <button type="button" onClick=${onClose}>Cancel</button>
              <button type="submit">Add</button>
            </div>
          </form>
        </div>
      `;
    }

    function Toast({ message }) {
      if (!message) return null;
      return html`<div class="toast">${message}</div>`;
    }

    function SettingsModal({ onClose, onToast, repos }) {
      const [privkey, setPrivkeyState] = useState(getPrivkey);
      const [testUrl, setTestUrl] = useState('https://melvin.me/public/git/sync/20260202/counter.txt');
      const [testResult, setTestResult] = useState(null);
      const [testing, setTesting] = useState(false);
      const [gitTestResult, setGitTestResult] = useState(null);
      const [gitTesting, setGitTesting] = useState(false);
      const [selectedRepo, setSelectedRepo] = useState(Object.keys(repos || {})[0] || '');

      const pubkey = useMemo(() => getPubkeyFromPrivkey(privkey), [privkey]);
      const isValid = pubkey.length === 64;

      const handleSave = () => {
        setPrivkey(privkey);
        onToast('Settings saved');
        onClose();
      };

      const handleTest = async () => {
        if (!isValid) {
          setTestResult({ success: false, message: 'Invalid private key' });
          return;
        }

        setTesting(true);
        setTestResult(null);

        try {
          // First GET the current value
          let currentValue = 0;
          try {
            const getRes = await fetch(testUrl + '?' + Date.now());
            if (getRes.ok) {
              const text = await getRes.text();
              currentValue = parseInt(text.trim()) || 0;
            }
          } catch (e) {
            // File doesn't exist yet, start at 0
          }

          // PUT the incremented value
          const newValue = currentValue + 1;
          const res = await nip98Fetch(testUrl, 'PUT', privkey, String(newValue));

          if (res.ok) {
            setTestResult({ success: true, message: `Success! Counter: ${currentValue} → ${newValue}` });
          } else {
            const text = await res.text();
            setTestResult({ success: false, message: `HTTP ${res.status}: ${text}` });
          }
        } catch (err) {
          setTestResult({ success: false, message: err.message });
        } finally {
          setTesting(false);
        }
      };

      const handleGitTest = async () => {
        if (!isValid || !selectedRepo) {
          setGitTestResult({ success: false, message: 'Need valid key and repo' });
          return;
        }

        // Save privkey first so pushRepo can access it
        setPrivkey(privkey);

        setGitTesting(true);
        setGitTestResult(null);

        try {
          const repo = repos[selectedRepo];
          if (!repo) throw new Error('Repo not found');

          // Create/update a test file with timestamp
          const timestamp = new Date().toISOString();
          await writeFile(selectedRepo, 'browser-test.txt', `Browser push test: ${timestamp}\n`);

          // Commit
          await commitChanges(selectedRepo, `Browser test: ${timestamp}`);

          // Push
          await pushRepo(selectedRepo, repo.cloneUrl, repo.branch);

          setGitTestResult({ success: true, message: `Pushed to ${selectedRepo}!` });
        } catch (err) {
          console.error('Git test error:', err);
          setGitTestResult({ success: false, message: err.message });
        } finally {
          setGitTesting(false);
        }
      };

      return html`
        <div class="modal-overlay" onClick=${onClose}>
          <div class="modal" onClick=${e => e.stopPropagation()} style="max-height: 90vh; overflow-y: auto;">
            <h2>Settings</h2>
            <label>
              <span>Private Key (hex)</span>
              <input
                type="password"
                value=${privkey}
                onInput=${e => setPrivkeyState(e.target.value)}
                placeholder="64 character hex private key"
              />
            </label>
            ${privkey && html`
              <div>
                <span style="font-size: 12px; color: #656d76;">Public Key:</span>
                <div class="pubkey-display ${isValid ? '' : 'error'}">
                  ${isValid ? pubkey : 'Invalid private key'}
                </div>
              </div>
            `}
            <hr style="margin: 16px 0; border: none; border-top: 1px solid #d0d7de;" />
            <label>
              <span>Test URL (PUT)</span>
              <input
                value=${testUrl}
                onInput=${e => setTestUrl(e.target.value)}
                placeholder="https://melvin.me/path/to/file.txt"
              />
            </label>
            <button
              class="test-btn"
              onClick=${handleTest}
              disabled=${!isValid || testing}
              style="margin-top: 8px;"
            >
              ${testing ? 'Testing...' : 'Test NIP-98 PUT'}
            </button>
            ${testResult && html`
              <div class="test-result ${testResult.success ? 'success' : 'error'}">
                ${testResult.message}
              </div>
            `}
            <hr style="margin: 16px 0; border: none; border-top: 1px solid #d0d7de;" />
            <label>
              <span>Test Git Push</span>
              <select
                value=${selectedRepo}
                onChange=${e => setSelectedRepo(e.target.value)}
                style="width: 100%; padding: 8px; border: 1px solid #d0d7de; border-radius: 6px;"
              >
                ${Object.keys(repos || {}).map(id => html`
                  <option key=${id} value=${id}>${id}</option>
                `)}
              </select>
            </label>
            <button
              class="test-btn"
              onClick=${handleGitTest}
              disabled=${!isValid || !selectedRepo || gitTesting}
              style="margin-top: 8px;"
            >
              ${gitTesting ? 'Pushing...' : 'Create Commit & Push'}
            </button>
            ${gitTestResult && html`
              <div class="test-result ${gitTestResult.success ? 'success' : 'error'}">
                ${gitTestResult.message}
              </div>
            `}
            <div class="buttons">
              <button type="button" onClick=${onClose}>Cancel</button>
              <button type="submit" onClick=${handleSave}>Save</button>
            </div>
          </div>
        </div>
      `;
    }

    // === Main App ===
    function App() {
      const [config, setConfig] = useState(loadConfig);
      const [selected, setSelected] = useState(null);
      const [syncing, setSyncing] = useState(null);
      const [pushing, setPushing] = useState(null);
      const [files, setFiles] = useState([]);
      const [expanded, setExpanded] = useState(new Set());
      const [selectedFile, setSelectedFile] = useState(null);
      const [fileContent, setFileContent] = useState('');
      const [localFiles, setLocalFiles] = useState({});
      const [showAddModal, setShowAddModal] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [relayStatus, setRelayStatus] = useState([]);
      const [toast, setToast] = useState('');

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3000);
      };

      // Load files when repo selected
      useEffect(() => {
        if (!selected) {
          setFiles([]);
          return;
        }
        loadFiles(selected, '').then(setFiles).catch(console.error);
      }, [selected]);

      // Load file content when file selected
      useEffect(() => {
        if (!selected || !selectedFile) {
          setFileContent('');
          setLocalFiles({});
          return;
        }

        async function loadContent() {
          const content = await readFile(selected, selectedFile);
          setFileContent(content);

          // If HTML file, scan for fetch() calls and load those files
          if (selectedFile.endsWith('.html')) {
            const data = {};

            // Find fetch('...') patterns in the HTML
            const fetchMatches = content.matchAll(/fetch\s*\(\s*['"]([^'"?]+)/g);
            for (const match of fetchMatches) {
              const fetchPath = match[1];
              try {
                const json = await readFile(selected, fetchPath);
                data[fetchPath] = JSON.parse(json);
              } catch (e) {
                console.warn(`Failed to load ${fetchPath}:`, e);
              }
            }

            setLocalFiles(data);
          } else {
            setLocalFiles({});
          }
        }

        loadContent().catch(console.error);
      }, [selected, selectedFile]);

      // Connect to relays
      useEffect(() => {
        const repoIds = Object.keys(config.repos);
        const trusted = [...new Set(Object.values(config.repos).flatMap(r => r.trusted))];

        if (repoIds.length === 0) return;

        const sockets = connectRelays(config.relays, repoIds, trusted, async (event) => {
          const dTag = event.tags.find(t => t[0] === 'd');
          if (!dTag) return;

          const repoId = dTag[1];
          if (!config.repos[repoId]) return;

          showToast(`Update detected: ${repoId}`);
          await syncRepo(repoId);
        });

        setRelayStatus(sockets.map(s => ({ url: s.url, status: s.status })));

        const interval = setInterval(() => {
          setRelayStatus(sockets.map(s => ({ url: s.url, status: s.status })));
        }, 1000);

        return () => {
          clearInterval(interval);
          sockets.forEach(s => s.ws.close());
        };
      }, [config.relays, Object.keys(config.repos).join(',')]);

      async function loadFiles(repoId, dirPath) {
        const entries = await listFiles(repoId, dirPath);
        return entries;
      }

      async function syncRepo(repoId) {
        const repo = config.repos[repoId];
        if (!repo) return;

        setSyncing(repoId);
        try {
          const exists = await repoExists(repoId);
          if (exists) {
            await pullRepo(repoId, repo.branch);
          } else {
            await cloneRepo(repoId, repo.cloneUrl, repo.branch);
          }
          showToast(`Synced: ${repoId}`);

          // Refresh files if this repo is selected
          if (selected === repoId) {
            const newFiles = await loadFiles(repoId, '');
            setFiles(newFiles);
          }
        } catch (err) {
          console.error('Sync error:', err);
          showToast(`Error: ${err.message}`);
        } finally {
          setSyncing(null);
        }
      }

      async function handlePush(repoId) {
        const repo = config.repos[repoId];
        if (!repo) return;

        const privkey = getPrivkey();
        if (!privkey) {
          showToast('No private key configured. Open Settings first.');
          return;
        }

        setPushing(repoId);
        try {
          await pushRepo(repoId, repo.cloneUrl, repo.branch);
          showToast(`Pushed: ${repoId}`);
        } catch (err) {
          console.error('Push error:', err);
          showToast(`Push error: ${err.message}`);
        } finally {
          setPushing(null);
        }
      }

      async function handleToggle(path) {
        const newExpanded = new Set(expanded);
        if (newExpanded.has(path)) {
          newExpanded.delete(path);
        } else {
          newExpanded.add(path);
          // Load children
          const children = await loadFiles(selected, path);
          setFiles(prevFiles => {
            const updateChildren = (entries) => {
              return entries.map(entry => {
                if (entry.path === path) {
                  return { ...entry, children };
                }
                if (entry.children) {
                  return { ...entry, children: updateChildren(entry.children) };
                }
                return entry;
              });
            };
            return updateChildren(prevFiles);
          });
        }
        setExpanded(newExpanded);
      }

      async function handleAddRepo({ id, cloneUrl, branch, trusted }) {
        const newConfig = {
          ...config,
          repos: {
            ...config.repos,
            [id]: { cloneUrl, branch, trusted }
          }
        };
        setConfig(newConfig);
        saveConfig(newConfig);
        setShowAddModal(false);

        // Clone the repo
        await syncRepo(id);
        setSelected(id);
      }

      async function handleDeleteRepo(repoId) {
        if (!confirm(`Delete ${repoId}?`)) return;

        try {
          await deleteRepo(repoId);
        } catch (err) {
          console.error('Delete error:', err);
        }

        const { [repoId]: _, ...rest } = config.repos;
        const newConfig = { ...config, repos: rest };
        setConfig(newConfig);
        saveConfig(newConfig);

        if (selected === repoId) {
          setSelected(null);
          setFiles([]);
        }
      }

      return html`
        <div class="app">
          <${Header} relayStatus=${relayStatus} onSettings=${() => setShowSettingsModal(true)} />
          <div class="main">
            <${RepoList}
              repos=${config.repos}
              selected=${selected}
              syncing=${syncing}
              pushing=${pushing}
              onSelect=${setSelected}
              onSync=${syncRepo}
              onPush=${handlePush}
              onDelete=${handleDeleteRepo}
              onAdd=${() => setShowAddModal(true)}
            />
            <div class="file-tree">
              ${selected ? html`
                <${FileTree}
                  files=${files}
                  selected=${selectedFile}
                  expanded=${expanded}
                  onSelect=${setSelectedFile}
                  onToggle=${handleToggle}
                />
              ` : html`
                <div class="empty-state">Select a repository</div>
              `}
            </div>
            <${FileView} path=${selectedFile} content=${fileContent} localFiles=${localFiles} />
          </div>
          ${showAddModal && html`
            <${AddRepoModal}
              onAdd=${handleAddRepo}
              onClose=${() => setShowAddModal(false)}
            />
          `}
          ${showSettingsModal && html`
            <${SettingsModal}
              onClose=${() => setShowSettingsModal(false)}
              onToast=${showToast}
              repos=${config.repos}
            />
          `}
          <${Toast} message=${toast} />
        </div>
      `;
    }

    // === Render ===
    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
